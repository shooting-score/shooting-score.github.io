<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f6">
<title>ShootingScanner – Web App</title>
<link rel="icon" href="home/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>
/* Apply the saved theme before the page draws, so it does not flash light first. */
try { var t = localStorage.getItem('hm-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-left" id="barLeft"></div>
  <h1 class="bar-title" id="barTitle">Sessions</h1>
  <div class="bar-right" id="barRight"></div>
</header>
<main id="main" class="main" aria-live="polite"></main>
<div class="busy" id="busy" hidden><div class="busy-box"><div class="spinner"></div><p id="busyText">Scanning target…</p></div></div>
<div class="toast" id="toast" hidden></div>

<dialog id="sessionDialog" class="dlg">
  <form method="dialog" id="sessionForm">
    <h2 id="sessionDialogTitle">New session</h2>
    <label>Name<input name="name" required maxlength="60" placeholder="Training"></label>
    <label><span>Discipline <small>(optional)</small></span><input name="disciplineName" maxlength="60" placeholder="e.g. Precision, Rapid fire, Field" list="disciplineList" autocomplete="off"></label>
    <label>Shooter<input name="shooter" required maxlength="60" placeholder="Me" list="shooterList" autocomplete="off"></label>
    <div class="pair">
      <label><span>Gun <small>(optional)</small></span><input name="gun" maxlength="60" placeholder="e.g. Walther LP500" list="gunList" autocomplete="off"></label>
      <label>Caliber<select name="caliber" id="caliberSelect" required></select></label>
    </div>
    <datalist id="shooterList"></datalist><datalist id="gunList"></datalist><datalist id="disciplineList"></datalist>
    <label>Date<input name="date" type="date" required></label>
    <label>Target type<select name="discipline" id="disciplineSelect"></select></label>
    <label>Shots per target<input name="shots" type="number" min="1" max="60" required></label>
    <label>Notes<textarea name="notes" rows="2" maxlength="400" placeholder="Pellets, ammunition, conditions…"></textarea></label>
    <div class="dlg-actions">
      <button type="button" class="btn" id="sessionCancel">Cancel</button>
      <button type="submit" class="btn primary" value="ok">Save</button>
    </div>
  </form>
</dialog>

<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script src="home/js/core.js"></script>
<script src="home/js/draw.js"></script>
<script src="home/js/detect.js"></script>
<script src="home/js/sample.js"></script>
<script src="home/js/store.js"></script>
<script src="home/js/app.js"></script>
</body>
</html>
